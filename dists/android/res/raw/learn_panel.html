<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ScummLearn</title>
<style>
  :root {
    --bg: rgba(12, 18, 32, 0.94);
    --card: #1b2540;
    --card-hi: #26335a;
    --text: #f4f6fb;
    --muted: #9aa6c4;
    --accent: #ffcc4d;
    --accent2: #5fb3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  body { display: flex; flex-direction: column; padding: 16px 16px 16px 88px; gap: 12px; }
  h1 { margin: 0; font-size: 20px; color: var(--muted); font-weight: 600; direction: rtl; text-align: right; }
  #lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 130px; }
  .line { background: var(--card); border-radius: 14px; padding: 12px 14px; }
  .line.latest { background: var(--card-hi); outline: 2px solid var(--accent2); }
  .speaker { color: var(--accent2); font-size: 14px; margin-bottom: 4px; }
  .en { direction: ltr; text-align: left; font-size: 24px; line-height: 1.5; }
  .w { padding: 2px 3px; border-radius: 6px; cursor: pointer; }
  .w:active, .w.sel { background: var(--accent); color: #1a1a1a; }
  .tools { display: flex; gap: 8px; margin-top: 8px; direction: rtl; }
  button { font: inherit; font-size: 16px; border: 0; border-radius: 10px; padding: 8px 12px;
    background: #33406a; color: var(--text); }
  button:active { background: #45558a; }
  .he { direction: rtl; text-align: right; font-size: 20px; color: var(--accent); margin-top: 8px; }
  #word { position: fixed; left: 88px; right: 16px; bottom: 16px; background: #fff; color: #111;
    border-radius: 16px; padding: 14px 16px; box-shadow: 0 8px 30px rgba(0,0,0,.5); display: none; }
  #word .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #word .en-w { font-size: 28px; font-weight: 700; direction: ltr; }
  #word .he-w { font-size: 24px; direction: rtl; text-align: right; margin-top: 6px; }
  #word .note { font-size: 15px; color: #555; direction: rtl; text-align: right; margin-top: 4px; }
  .empty { color: var(--muted); direction: rtl; text-align: right; font-size: 18px; margin-top: 20px; }
</style>
</head>
<body>
  <h1>מה אמרו במשחק? · לחצו על מילה</h1>
  <div id="lines"></div>
  <div id="word">
    <div class="top">
      <span class="en-w" id="wEn"></span>
      <button id="wSay">🔊</button>
    </div>
    <div class="he-w" id="wHe"></div>
    <div class="note" id="wNote"></div>
  </div>

<script>
(function () {
  const SHOW = 5;
  const bridge = window.Android || null;
  let lines = [];
  const cache = {};

  // ---- data --------------------------------------------------------------
  function loadLines() {
    if (bridge) {
      try { lines = JSON.parse(bridge.getLines()).map(s => typeof s === 'string' ? JSON.parse(s) : s); }
      catch (e) { lines = []; }
    } else {
      // Browser dev mode: sample lines captured from the CMI demo.
      lines = [
        {kind: 'dialog', speaker: '', text: "I've got to get out of here and help Elaine!"},
        {kind: 'dialog', speaker: '', text: 'If I could only get through this one door...'},
        {kind: 'dialog', speaker: '', text: 'Quit yer mumbling, captive!'},
        {kind: 'dialog', speaker: '', text: 'Blast ye scurvy dogs!'},
        {kind: 'dialog', speaker: '', text: 'Avast, ye swabs! Prepare fer yer doom!'}
      ];
    }
    lines = lines.filter(l => l && l.text && (l.kind === 'dialog' || l.kind === 'video'));
  }

  function setting(key) {
    if (bridge) return bridge.getSetting(key) || '';
    return localStorage.getItem('sl_' + key) || '';
  }

  // Offline dictionary bundled with the app: {lines:{en:he}, words:{w:{he,note}}}
  let dict = {lines: {}, words: {}};
  try {
    if (bridge && bridge.getDict) dict = JSON.parse(bridge.getDict());
    else { const x = new XMLHttpRequest(); x.open('GET', 'learn_dict.json', false); x.send(); if (x.status < 300 || x.status === 0) dict = JSON.parse(x.responseText); }
  } catch (e) {}
  dict.lines = dict.lines || {}; dict.words = dict.words || {};
  const norm = t => t.replace(/\s+/g, ' ').trim();

  function offline(text) {
    const he = dict.lines[norm(text)];
    if (!he) return null;
    return {he: he, words: dict.words};
  }

  // Offline first; the translation server (optional) covers lines not in the dictionary.
  async function translate(text) {
    if (cache[text]) return cache[text];
    const off = offline(text);
    if (off) return (cache[text] = off);
    const url = setting('translate_url');
    if (!url) return null;
    const res = await fetch(url.replace(/\/$/, '') + '/translate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    cache[text] = data;
    return data;
  }

  function speak(t) {
    if (bridge) bridge.speak(t);
    else if (window.speechSynthesis) {
      const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  }

  // ---- rendering ---------------------------------------------------------
  const box = document.getElementById('lines');

  function render() {
    box.innerHTML = '';
    const recent = lines.slice(-SHOW);
    if (!recent.length) {
      box.innerHTML = '<div class="empty">עוד לא נאמר כלום במשחק. שחקו קצת וחזרו לכאן.</div>';
      return;
    }
    recent.forEach((l, i) => box.appendChild(lineEl(l, i === recent.length - 1)));
    box.scrollTop = box.scrollHeight;
  }

  function lineEl(l, latest) {
    const div = document.createElement('div');
    div.className = 'line' + (latest ? ' latest' : '');
    if (l.speaker) {
      const s = document.createElement('div'); s.className = 'speaker'; s.textContent = l.speaker;
      div.appendChild(s);
    }
    const en = document.createElement('div'); en.className = 'en';
    l.text.split(/(\s+)/).forEach(tok => {
      if (/^\s+$/.test(tok) || !tok) { en.appendChild(document.createTextNode(tok)); return; }
      const w = document.createElement('span'); w.className = 'w'; w.textContent = tok;
      w.onclick = () => showWord(w, tok, l.text);
      en.appendChild(w);
    });
    div.appendChild(en);

    const tools = document.createElement('div'); tools.className = 'tools';
    const say = document.createElement('button'); say.textContent = '🔊 הקראה';
    say.onclick = () => speak(l.text);
    const tr = document.createElement('button'); tr.textContent = 'מה זה אומר?';
    const he = document.createElement('div'); he.className = 'he';
    tr.onclick = async () => {
      he.textContent = '...';
      try {
        const d = await translate(l.text);
        he.textContent = d ? d.he : '(אין עדיין תרגום לשורה הזו)';
      } catch (e) { he.textContent = 'אין חיבור לתרגום כרגע.'; }
    };
    tools.appendChild(say); tools.appendChild(tr);
    div.appendChild(tools); div.appendChild(he);
    return div;
  }

  const card = document.getElementById('word');
  let selEl = null;

  function clean(tok) { return tok.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, ''); }

  async function showWord(el, tok, sentence) {
    const word = clean(tok);
    if (!word) return;
    if (selEl) selEl.classList.remove('sel');
    selEl = el; el.classList.add('sel');
    speak(word);
    document.getElementById('wEn').textContent = word;
    document.getElementById('wSay').onclick = () => speak(word);
    const he = document.getElementById('wHe'), note = document.getElementById('wNote');
    he.textContent = '...'; note.textContent = '';
    card.style.display = 'block';
    try {
      const d = await translate(sentence);
      const lw = word.toLowerCase();
      const info = (d && d.words && (d.words[lw] || d.words[word])) || dict.words[lw];
      if (info) { he.textContent = info.he; note.textContent = info.note || ''; }
      else he.textContent = '(אין פירוש למילה הזו)';
    } catch (e) {
      const info = dict.words[word.toLowerCase()];
      if (info) { he.textContent = info.he; note.textContent = info.note || ''; }
      else he.textContent = '(אין פירוש למילה הזו)';
    }
  }

  box.addEventListener('scroll', () => { card.style.display = 'none'; });

  // ---- hooks called from Java -------------------------------------------
  window.onOpen = function () { card.style.display = 'none'; loadLines(); render(); };
  window.onLine = function (l) {
    if (l && (l.kind === 'dialog' || l.kind === 'video')) { lines.push(l); render(); }
  };

  window.onOpen();
})();
</script>
</body>
</html>
