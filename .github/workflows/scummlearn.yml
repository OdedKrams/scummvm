name: ScummLearn builds

# Builds a trimmed ScummVM (SCUMM engine only) with the ScummLearn bridge:
#  - Android APK (arm64) to install on the tablet
#  - Windows x64 build for quick testing on the PC
# Download the results from the run's "Artifacts" section.

on:
  push:
    branches: [scummlearn]
  workflow_dispatch:

# A new push cancels older builds that are still queued or running.
concurrency:
  group: scummlearn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: "23.2.8568313"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build oboe (Android audio library ScummVM needs)
        run: |
          # Same recipe as ScummVM's build farm (dockerized-bb, android-common/packages/oboe)
          SYSROOT="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          curl -sSL https://github.com/google/oboe/archive/refs/tags/1.10.0.tar.gz | tar xz
          cmake -S oboe-1.10.0 -B oboe-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_NATIVE_API_LEVEL=21 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
          cmake --build oboe-build -j"$(nproc)"
          install -D oboe-build/liboboe.a "$SYSROOT/usr/lib/aarch64-linux-android/21/liboboe.a"
          mkdir -p "$SYSROOT/usr/include"
          cp -r oboe-1.10.0/include/oboe "$SYSROOT/usr/include/"
          rm -rf oboe-1.10.0 oboe-build

      - name: Configure
        run: |
          ./configure --host=android-arm64-v8a \
            --disable-all-engines --enable-engine=scumm,scumm_7_8,he \
            --enable-release --disable-debug

      - name: Build
        run: |
          report() {  # surface errors as annotations (readable without log access)
            grep -E "error|Error|FAILED|What went wrong|\*\*\*" "$1" | tail -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
            exit 1
          }
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log > /dev/null || report build.log
          make ScummVM-debug.apk 2>&1 | tee apk.log | tail -20 || report apk.log

      - uses: actions/upload-artifact@v4
        with:
          name: scummlearn-android-arm64
          path: ScummVM-debug.apk

      # Public, login-free download of the newest APK (used by debug.bat and the tablet):
      # https://github.com/OdedKrams/scummvm/releases/download/scummlearn-latest/ScummVM-debug.apk
      - name: Publish to the scummlearn-latest release
        if: github.ref == 'refs/heads/scummlearn'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view scummlearn-latest >/dev/null 2>&1 || \
            gh release create scummlearn-latest --prerelease --target "$GITHUB_SHA" \
              --title "ScummLearn latest APK" --notes "Newest build of the scummlearn branch."
          gh release upload scummlearn-latest ScummVM-debug.apk --clobber
          gh release edit scummlearn-latest --notes "Newest build: ${GITHUB_SHA::8}"

  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_VCPKG_COMMIT: ef7dbf94b9198bc58f45951adcf1f041fcbc5ea0
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/.github/vcpkg-ports
    steps:
      - uses: actions/checkout@v4

      - name: Setup nasm
        uses: ilammy/setup-nasm@v1

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}

      - name: Integrate vcpkg
        run: ${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/vcpkg integrate install

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-

      - name: Build create_project
        run: |
          cd devtools/create_project/cmake
          cmake .
          cmake --build . -j 2

      - name: Call create_project
        run: |
          mkdir build-scummvm
          cd build-scummvm
          ../devtools/create_project/cmake/Debug/create_project.exe .. --msvc --vcpkg --disable-all-engines --enable-engine=scumm,scumm_7_8,he

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install vcpkg packages
        run: vcpkg install

      - name: Build scummvm
        run: |
          cd build-scummvm
          ls
          msbuild scummvm.sln /m /p:VcpkgEnableManifest=true /p:BuildInParallel=true /p:Configuration=Release /p:PreferredToolArchitecture=x64 /p:Platform=x64 /v:minimal

      - uses: actions/upload-artifact@v4
        with:
          name: scummlearn-windows-x64
          path: |
            build-scummvm/Releasex64/*.exe
            build-scummvm/Releasex64/*.dll
